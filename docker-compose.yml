version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prestige_postgres
    restart: always
    environment:
      POSTGRES_USER: prestige_user
      POSTGRES_PASSWORD: prestige_secure_password
      POSTGRES_DB: prestige_mbm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestige_user -d prestige_mbm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
